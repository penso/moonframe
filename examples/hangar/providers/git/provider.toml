# The built-in git provider, here so that the bays mod may add and remove
# worktrees. Everything else is as the app ships it.

# The git state of the repository of the terminal last used (else the one
# the app runs from), shared as `app.git`:
# branch, ahead/behind, changed files with +/- counts, HEAD, worktrees,
# recent branches, remote and stashes, and on request one file's diff and
# the recent commits with their parents (`{ log = 200 }`, `{ log = false }`).
# Mods also ask it to commit (`{ commit = "message", root, id = ... }`) or
# push (`{ push = true, root, id = ... }`), `root` naming the repository as
# `app.git.root` gave it (refused once it moved); it answers the mod that
# asked with
# `{ reply = id, action, ok, message | error }`.
# They add a worktree (`{ worktree_add = { branch, base? }, root, id }`, whose
# reply's `message` is its folder) or remove one (`{ worktree_remove = path,
# root, id }`): never its branch, and never one with uncommitted changes.
# A native provider: Rust built into the app (crates/moonframe-git, the
# `git` feature), running git through herdr-vcs with your own access.
interval = 1.0
kind     = "native"

[settings]
# The mods that may commit, push and change worktrees; any other is refused. The status
# bar's sheet acts only when the user clicks. Add your own mod here to let
# it write.
writers = ["bays"]
