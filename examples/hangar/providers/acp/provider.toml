# Send feedback: the built-in `acp` provider, here so that the agent the
# `?` starts (the built-in mods/feedback, kept in moonframe.toml) is told
# to change this app's folder.
interval = 0.25
kind     = "native"

[settings]
agent    = "claude"
starters = ["feedback"]
# Questions for tools that only look are allowed once; the rest ask you
# (see the app's providers/acp for "all").
allow = { feedback = "read" }
